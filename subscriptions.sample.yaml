# Sample configuration. Copy to subscriptions.yaml and edit.
# subscriptions.yaml is gitignored; this sample is tracked in git.

settings:
  download_dir: /srv/files/ytwatcher/
  check_interval_minutes: 30
  recent_videos_to_scan: 10
  api_port: 8791
  # Where the API listens. Default 127.0.0.1, which is all you need when
  # nginx proxies /ytwatcher/api/ on the same host.
  # api_host: 127.0.0.1
  # Extra Host-header names the API answers for, beyond the server's own
  # addresses: exact hostnames, CIDR networks, or IP-prefix wildcards
  # ("192.168.0.*" — IP literals only, see host_allowed). Guards against
  # DNS-rebinding; it is NOT authentication — the API is unauthenticated
  # by design ("network-trusted" posture).
  # api_allowed_hosts:
  #   - "192.168.0.0/24"
  #   - "100.64.0.0/10"
  # Title of the generated index.html page (used for <title> and <h1>).
  site_title: Downloads
  # Skip videos uploaded more than this many days ago. Videos with unknown
  # upload times are not skipped. Comment out / remove to disable.
  max_video_age_days: 2
  # Only list files whose timestamp is at most this many days old on the
  # index page; older files stay on disk but drop off the listing. The
  # manually/ folder is exempt (deliberate one-off downloads). Watched
  # files are never listed anyway (deleted or archived into 'watched/'
  # subfolders). Comment out / remove to list everything.
  watchlist_max_age_days: 5

# Per-subscription title filter:
#   match: all                      download everything, or a list of
#                                   keywords; video matches if any keyword
#                                   appears in its title (case-insensitive)
#   exclude: ["trailer", "预告"]    optional; skip videos whose title
#                                   contains any of these (wins over match)
#   match_description: true         optional; for keyword-based subscriptions
#                                   the video description is checked too when
#                                   the title doesn't match (one extra metadata
#                                   query per non-matching video); default false
#   match_watchlist: /path/file     optional; extra match keywords read from
#                                   a text file or a list of files (one
#                                   keyword per line, '#' comments); files
#                                   are re-read whenever they change. Entries
#                                   match as whole words, TITLE ONLY
#                                   (match_description ignores them) — meant
#                                   for stock tickers, where substring
#                                   matching would false-positive
#                                   (TER in "Wetter").
#
# Per-subscription Shorts filter (optional, per subscription):
#   skip_shorts: true          skip videos that look like YouTube Shorts
#   shorts_max_duration: 60    videos this many seconds or shorter count
#                              as Shorts (default 60)
#
#   keep_watched: true         optional; instead of deleting files you mark
#                              as watched, move them into a 'watched'
#                              subdirectory of the channel folder (default
#                              false)

subscriptions:
  - name: Veritasium
    url: https://www.youtube.com/@veritasium
    match: all
    quality: "bestvideo[height<=720]+bestaudio/best[height<=720]"
    skip_shorts: true
    shorts_max_duration: 600

  - name: ExampleNews
    url: https://www.youtube.com/@ExampleNews
    match: ["keyword1", "keyword2"]
    exclude: ["trailer"]
    match_description: true
    quality: "bestvideo[height<=720]+bestaudio/best[height<=720]"
    skip_shorts: false

  # url can also be a list: all channels are combined under one name.
  - name: MultiChannel
    url:
      - https://www.youtube.com/@ChannelA
      - https://www.youtube.com/@ChannelB
    match: all
    quality: "bestvideo[height<=720]+bestaudio/best[height<=720]"
